filetype: corelab-scriptembly
detect:
  header: '^#!.*/(env +)?corelab|@corelab\.exe'
rules:
  # strings:
  - constant.string: '"(\\.|[^"])*"'

  # preprocessor commands:
  - preproc.shebang: '^#!.*/(env +)?corelab|@corelab\.exe.*'
  - preproc.shebang: '(?i)(^|\s)@goto.*'
  - preproc.shebang: '(?i)(^|\s):eof.*'

  # instructions:
  - statement: '(?i)\b(ATIO|ATME|ATPU|CRIO|CFIO|CFME|CFPU|CHWD|CRME|CRPU|DIIO|DIME|DIPU|DSIO|DSME|DSPU|DTIO|DTME|DTPU|EDME|ENIO|ENME|ENPU|EXAP|IRQ|LDME|LDPR|LDSC|LDSS|NMI|NWPR|NWSC|RNIO|RSAP|RSIO|RSME|RSPU|RST|RUN|RUSC|RWIO|SESC|SHBL|SHBM|SHHV|SHIL|SHIO|SHME|SHRL|SHRV|SHSC|SHSE|STEP|STOP|STSC|SVME|SVPR|SVSC|SVSS|ADD|AND|BIT|CALL|COMP|CONV|DEC|DEPO|END|EXAM|EXIT|HELP|INC|INRG|JPEQ|JPZR|JPGE|JPGT|JPLE|JPLT|JPNE|JPNZ|MUL|NOT|OR|PRNT|RTRN|SHL|SHR|SUB|SWAP|WAIT|XOR)\b'

  # registers:
  - identifier: '(?i)\$R[A-Z0-9]\b'

  # one-line comments:
  - comment: '(^|\s);.*'
                
