filetype: corelab-scriptembly
detect:
  header: '^#!.*/(env +)?corelab|@corelab\.exe'
rules:
  # strings:
  - constant.string: '"(\\.|[^"])*"'

  # preprocessor commands:
  - preproc.shebang: '^#!.*/(env +)?corelab|@corelab\.exe.*'
  - preproc.shebang: '(?i)(^|\s)@goto.*'
  - preproc.shebang: '(?i)(^|\s):eof.*'

  # instructions:
  - statement: '(?i)\b(ADD|AND|ATIO|ATME|ATPU|BIT|CALL|CFIO|CFME|CFPU|CHWD|COMP|CONV|CRIO|CRME|CRPU|DEC|DIIO|DIME|DIPU|DSIO|DSME|DSPU|DTIO|DTME|DTPU|EDME|END|ENIO|ENME|ENPU|EXAP|EXIT|HELP|INC|INRG|JPCA|JPNC|JPNZ|JPZE|JUMP|LDME|LDPR|LDRG|LDSC|MUL|MVIO|NMI|NOT|NWPR|NWSC|OR|PRNT|RDIO|RDME|RNIO|RSAP|RSIO|RSME|RSPU|RST|RTRN|RUN|RUSC|RWIO|SESC|SHBL|SHBM|SHHV|SHIL|SHIO|SHL|SHME|SHR|SHRL|SHRV|SHSC|SHSE|STEP|STOP|STSC|SUB|SVME|SVPR|SVSC|SWAP|SZIO|WAIT|WRIO|WRME|XOR)\b'

  # registers:
  - identifier: '(?i)\$R[A-Z0-9]\b'

  # one-line comments:
  - comment: '(^|\s);.*'
                
