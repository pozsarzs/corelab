filetype: corelab-scriptembly
detect:
  header: '^#!.*/(env +)?corelab|@corelab\.exe'
rules:
  # parent classes:
  - type: '\bT[A-Z,0-9]\w*\b'

  # strings:
  - constant.string: '"(\\.|[^"])*"'

  # preprocessor commands:
  - preproc.shebang: '^#!.*/(env +)?corelab|@corelab\.exe.*'
  - preproc.shebang: '(?i)(^|\s)@goto.*'
  - preproc.shebang: '(?i)(^|\s):eof.*'

  # instructions:
  - statement: '(?i)\b(ABS|ADD|AND|APPX|ASCI|ATTH|BIT|CALL|CALM|CHAR|COMP|CONV|CRTE|DEC|DEPO|DEST|DETH|END|EXAM|EXIT|FILL|GETP|HELP|IDV|IMD|INC|INDX|INPW|INRG|JPEQ|JPGE|JPGT|JPLE|JPLT|JPNE|JPNZ|JPZR|MSGW|MUL|NOT|OR|PAUS|POPA|PRNT|PSHA|RDV|RSET|RTRN|SAPP|SDEL|SETP|SETV|SFND|SHL|SHR|SINS|SLEN|SLOW|SREP|SSUB|STEP|STOP|STRT|SUB|SUPP|SWAP|WAIT|XOR)\b'

  # constants, variables, classes, objects:
  - identifier: '(?i)\$\w+(?:\.\w+)*\b'

  # system constants:
  - symbol: '\$\?'
  - symbol: '(?i)\$(?:ARG|ARGCNT|DATE|FC|FZ|HOME|INSCNT|PRJDIR|RNDB|RNDI|RNDW|TIME|VER)\b'

  # one-line comments:
  - comment: '(^|\s);.*'
