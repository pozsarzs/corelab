[General]
# A fő könyvtár, ahol a projektek alapértelmezetten laknak
default_project_dir=~/Documents/CoreLabProjects/
# A legutóbb megnyitott projektek listája a gyors megnyitáshoz
recent_projects=~/Documents/CoreLabProjects/proc_compare/proc.clprj;~/Documents/CoreLabProjects/test_system/test.clprj

[Appearance]
# Globális téma (pl. sötét/világos mód), ami minden ablakra érvényes
theme=dark
font_family=Monospace
font_size=12

[Simulation]
# Globális korlátok vagy biztonsági beállítások
max_simulation_steps_per_run=1000000
enable_telemetry=false
[Paths]
# Keresési útvonalak a dinamikusan betölthető modulokhoz
module_search_paths=/usr/lib/corelab/;~/.local/share/corelab/modules/
# Külső disassembler vagy fordítóprogramok útvonala (ha van)
toolchain_dir=/usr/bin/
[Console]
history_size=500          # Hány parancsra emlékezzen a felfelé nyíllal
tab_completion=true       # Működjön-e a parancskiegészítés Tab gombra
auto_clear_on_reset=false # Törlődjön-e a konzol a szimuláció újraindításakor
[Diagnostics]
log_level=DEBUG           # ERROR, WARNING, INFO, DEBUG
log_file=~/.cache/corelab/corelab.log
enable_crash_dumps=true   # Mentse-e a memóriát összeomlás esetén

[Shortcuts]
simulation_run=F9
simulation_step=F8
simulation_stop=F5
toggle_console=Ctrl+`
[Editor]
tab_width=2
use_spaces=true           # Tab helyett szóközök használata
show_line_numbers=true
auto_indent=true







